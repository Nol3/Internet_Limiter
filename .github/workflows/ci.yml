name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  calidad:
    name: Análisis estático y pruebas
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Análisis estático (ruff)
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Pruebas (no necesitan driver ni administrador)
        run: python -m pytest tests -q

  empaquetado:
    name: Ejecutable e instalador
    needs: calidad
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compilar Limitador.exe
        run: python -m PyInstaller --clean --noconfirm Limitador.spec

      - name: Comprobar que el ejecutable arranca
        run: dist\Limitador.exe --version

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compilar el instalador
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss'
        shell: pwsh

      - name: Guardar artefactos
        uses: actions/upload-artifact@v4
        with:
          name: Limitador-2.0.0
          path: |
            dist/Limitador.exe
            installer_output/Setup_*.exe
          if-no-files-found: error
